services:
  - type: web
    name: smart-yard-gate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app('production')" --workers 2 --threads 4 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_SQLITE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
